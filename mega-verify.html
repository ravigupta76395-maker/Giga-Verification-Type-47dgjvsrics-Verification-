<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Verify — Task Payment</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Exo 2',sans-serif;
  background:#03040a;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* ===== RAINBOW BG ===== */
.bg-rainbow{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 10% 20%, rgba(255,0,128,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 90% 10%, rgba(0,200,255,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 70% 40% at 50% 90%, rgba(120,0,255,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 40% 60% at 80% 70%, rgba(0,255,150,0.10) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 20% 80%, rgba(255,200,0,0.08) 0%,transparent 60%);
  animation:bgShift 8s ease-in-out infinite alternate;
}
@keyframes bgShift{
  from{filter:hue-rotate(0deg);}
  to{filter:hue-rotate(60deg);}
}

/* Grid */
.grid{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);
  background-size:32px 32px;
}

/* Stars */
.stars{position:fixed;inset:0;z-index:0;}
.star{position:absolute;border-radius:50%;animation:tw var(--d) ease-in-out infinite;opacity:0;}
@keyframes tw{0%,100%{opacity:0;}50%{opacity:var(--o);}}

/* ===== CARD ===== */
.card{
  position:relative;z-index:20;
  width:330px;
  background:rgba(6,8,18,0.92);
  border-radius:28px;
  padding:28px 22px 24px;
  text-align:center;
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.07);
  box-shadow:0 0 0 1px rgba(255,255,255,0.04),0 40px 80px rgba(0,0,0,0.8);
  animation:cardIn .7s cubic-bezier(.16,1,.3,1) both;
  overflow:hidden;
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.93);}to{opacity:1;transform:none;}}

/* Rainbow top border animated */
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#ff0080,#ff8c00,#ffe000,#00ff88,#00cfff,#7c3aed,#ff0080);
  background-size:200% 100%;
  animation:rainbowSlide 2s linear infinite;
}
@keyframes rainbowSlide{from{background-position:0% 50%;}to{background-position:200% 50%;}}

/* ===== BADGE ===== */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px 4px 8px;margin-bottom:18px;
  border-radius:50px;font-family:'Orbitron',sans-serif;
  font-size:8px;font-weight:700;letter-spacing:1.5px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.7);
  animation:badgePulse 2s ease-in-out infinite;
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88;animation:bdot 1s ease-in-out infinite;}
@keyframes bdot{0%,100%{opacity:1;}50%{opacity:.2;}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 10px rgba(0,255,136,0.1);}50%{box-shadow:0 0 20px rgba(0,255,136,0.25);}}

/* ===== MEGA CIRCLE SYSTEM ===== */
.mega-circle{
  width:180px;height:180px;
  margin:0 auto 20px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}

/* Each ring with different color + speed */
.ring{
  position:absolute;border-radius:50%;
  border:2px solid transparent;
}
.r1{inset:0;   border-top-color:#ff0080;border-right-color:rgba(255,0,128,.3);animation:sp 1.0s linear infinite;}
.r2{inset:10px;border-top-color:#ff8c00;border-left-color:rgba(255,140,0,.3); animation:sp 1.4s linear infinite reverse;}
.r3{inset:20px;border-top-color:#ffe000;border-right-color:rgba(255,224,0,.3);animation:sp 1.8s linear infinite;}
.r4{inset:30px;border-top-color:#00ff88;border-left-color:rgba(0,255,136,.3); animation:sp 2.2s linear infinite reverse;}
.r5{inset:40px;border-top-color:#00cfff;border-right-color:rgba(0,207,255,.3);animation:sp 1.6s linear infinite;}
.r6{inset:50px;border-top-color:#7c3aed;border-left-color:rgba(124,58,237,.3); animation:sp 2.6s linear infinite reverse;}
.r7{inset:60px;border-top-color:#ff0080;border-right-color:rgba(255,0,128,.2);animation:sp 3.0s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* Dots on rings */
.ring::before{
  content:'';position:absolute;
  width:6px;height:6px;border-radius:50%;
  top:50%;left:50%;
  transform-origin:0 0;
  animation:inherit;
}
.r1::before{background:#ff0080;box-shadow:0 0 8px #ff0080;top:-3px;left:50%;}
.r2::before{background:#ff8c00;box-shadow:0 0 8px #ff8c00;top:calc(100% - 3px);left:50%;}
.r3::before{background:#ffe000;box-shadow:0 0 8px #ffe000;top:-3px;left:50%;}
.r4::before{background:#00ff88;box-shadow:0 0 8px #00ff88;top:calc(100% - 3px);left:50%;}
.r5::before{background:#00cfff;box-shadow:0 0 8px #00cfff;top:-3px;left:50%;}
.r6::before{background:#7c3aed;box-shadow:0 0 8px #7c3aed;top:calc(100% - 3px);left:50%;}

/* Center orb */
.orb{
  width:58px;height:58px;border-radius:50%;
  position:relative;z-index:5;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  transition:all .5s;
  animation:orbPulse 2s ease-in-out infinite;
}
.orb-bg{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#ff0080,#ff8c00,#ffe000,#00ff88,#00cfff,#7c3aed,#ff0080);
  opacity:.15;
  animation:sp 4s linear infinite;
}
.orb-inner{
  position:absolute;inset:3px;border-radius:50%;
  background:rgba(6,8,18,0.95);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
@keyframes orbPulse{
  0%,100%{box-shadow:0 0 20px rgba(0,207,255,0.2);}
  33%{box-shadow:0 0 30px rgba(255,0,128,0.3);}
  66%{box-shadow:0 0 30px rgba(0,255,136,0.3);}
}

/* ===== TITLE ===== */
.title{
  font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;
  margin-bottom:4px;
  background:linear-gradient(90deg,#ff0080,#ff8c00,#ffe000,#00ff88,#00cfff,#7c3aed);
  background-size:200% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:rainbowTxt 3s linear infinite;
}
@keyframes rainbowTxt{from{background-position:0%;}to{background-position:200%;}}

.sub{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:16px;line-height:1.5;min-height:16px;}

/* ===== AMOUNT ===== */
.amt-box{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.03);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;
  border:1px solid rgba(255,255,255,.07);
  position:relative;overflow:hidden;
}
.amt-box::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);
  animation:shimmer 2.5s linear infinite;
}
@keyframes shimmer{from{transform:translateX(-100%);}to{transform:translateX(100%);}}
.amt-label{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.5px;}
.amt-val{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;
  background:linear-gradient(135deg,#ffe000,#ff8c00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* ===== PROGRESS ===== */
.prog-wrap{width:100%;height:5px;background:rgba(255,255,255,.05);border-radius:4px;margin-bottom:14px;overflow:hidden;}
.prog-bar{
  height:100%;width:0%;border-radius:4px;transition:width .5s ease;
  background:linear-gradient(90deg,#ff0080,#ff8c00,#ffe000,#00ff88,#00cfff,#7c3aed);
  background-size:200% 100%;
  animation:rainbowSlide 1.5s linear infinite;
  box-shadow:0 0 10px rgba(0,207,255,.5);
}

/* ===== STEPS ===== */
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;text-align:left;}
.step{
  display:flex;align-items:center;gap:9px;
  padding:8px 11px;border-radius:10px;font-size:11.5px;
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  color:rgba(255,255,255,.35);transition:all .4s;
}
.step.active{
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.12);
  color:rgba(255,255,255,.9);
  box-shadow:0 0 14px rgba(0,207,255,.08);
}
.step.done{background:rgba(0,255,136,.04);border-color:rgba(0,255,136,.18);color:rgba(255,255,255,.7);}
.step.fail{background:rgba(255,0,128,.04);border-color:rgba(255,0,128,.18);color:rgba(255,255,255,.5);}

.si{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.st{flex:1;}
.ss{
  font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:.5px;
  color:rgba(255,255,255,.25);margin-left:auto;white-space:nowrap;
}
.step.active .ss{
  background:linear-gradient(90deg,#00cfff,#00ff88);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:rainbowTxt 2s linear infinite;
}
.step.done .ss{color:#00ff88;}
.step.fail .ss{color:#ff0080;}

/* ===== REWARD ===== */
.reward{
  display:none;border-radius:14px;padding:14px;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(0,255,136,.06),rgba(0,207,255,.05));
  border:1px solid rgba(0,255,136,.2);
  animation:popIn .5s cubic-bezier(.16,1,.3,1) both;
  position:relative;overflow:hidden;
}
.reward::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,#ff0080,#ffe000,#00ff88,#00cfff,#7c3aed);
  background-size:200%;animation:rainbowSlide 2s linear infinite;
}
.reward.show{display:block;}
@keyframes popIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.reward-label{font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:2px;color:rgba(0,255,136,.7);margin-bottom:4px;}
.reward-amt{
  font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;
  background:linear-gradient(135deg,#00ff88,#00cfff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.reward-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px;}

/* ===== BUTTON ===== */
.btn{
  display:none;width:100%;padding:14px;border:none;border-radius:13px;
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;
  cursor:pointer;letter-spacing:.8px;transition:all .3s;
  align-items:center;justify-content:center;gap:8px;
  animation:popIn .45s cubic-bezier(.16,1,.3,1) both;
  position:relative;overflow:hidden;
}
.btn.show{display:flex;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent);}

.btn.green{
  background:linear-gradient(135deg,#00b865,#00ff88);color:#021a0e;
  box-shadow:0 6px 28px rgba(0,255,136,.3);
}
.btn.green:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(0,255,136,.5);}

.btn.red{
  background:linear-gradient(135deg,#c0002a,#ff0080);color:#fff;
  box-shadow:0 6px 28px rgba(255,0,128,.3);
}
.btn.red:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(255,0,128,.5);}

.btn.orange{
  background:linear-gradient(135deg,#c06000,#ff8c00);color:#fff;
  box-shadow:0 6px 28px rgba(255,140,0,.25);opacity:.75;cursor:not-allowed;
}

/* ===== FOOTER ===== */
.footer{margin-top:16px;font-size:10px;color:rgba(255,255,255,.18);line-height:1.9;}
.brand{
  font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:2px;
  background:linear-gradient(90deg,#ff0080,#ffe000,#00ff88,#00cfff);
  background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:rainbowTxt 3s linear infinite;
}
.footer a{color:rgba(124,100,255,.6);text-decoration:none;}
.footer a:hover{color:rgba(170,140,255,.9);}

/* ===== CONFETTI ===== */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;display:none;}
.conf{
  position:absolute;top:-12px;left:var(--l);
  width:var(--w);height:var(--h);
  background:var(--c);border-radius:var(--r);
  animation:fall var(--d) ease-in var(--dl) both;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg) scaleX(1);opacity:1;}
  50%{transform:translateY(50vh) rotate(360deg) scaleX(-1);opacity:.9;}
  100%{transform:translateY(110vh) rotate(720deg) scaleX(1);opacity:0;}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="bg-rainbow"></div>
<div class="grid"></div>
<div class="confetti-wrap" id="conf"></div>

<div class="card" id="card">

  <div class="badge"><div class="badge-dot"></div>TASK PAYMENT SYSTEM</div>

  <!-- MEGA CIRCLES -->
  <div class="mega-circle">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
    <div class="ring r6"></div>
    <div class="ring r7"></div>
    <div class="orb">
      <div class="orb-bg"></div>
      <div class="orb-inner" id="orbIcon">💳</div>
    </div>
  </div>

  <div class="title" id="title">VERIFYING...</div>
  <div class="sub"   id="sub">Checking your device & task status.</div>

  <div class="amt-box">
    <div><div class="amt-label">PENDING REWARD</div></div>
    <div class="amt-val" id="amtVal">₹0.00</div>
  </div>

  <div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>

  <div class="steps">
    <div class="step" id="s1"><span class="si">📱</span><span class="st">Device Fingerprint</span><span class="ss" id="ss1">PENDING</span></div>
    <div class="step" id="s2"><span class="si">🌐</span><span class="st">VPN / Proxy Scan</span><span class="ss" id="ss2">PENDING</span></div>
    <div class="step" id="s3"><span class="si">✅</span><span class="st">Task Completion</span><span class="ss" id="ss3">PENDING</span></div>
    <div class="step" id="s4"><span class="si">💸</span><span class="st">Payment Processing</span><span class="ss" id="ss4">PENDING</span></div>
  </div>

  <div class="reward" id="reward">
    <div class="reward-label">🎉 PAYMENT APPROVED</div>
    <div class="reward-amt" id="rewardAmt">₹0.00</div>
    <div class="reward-sub">Credited to your wallet ✨</div>
  </div>

  <button class="btn" id="btn">✅ Proceed to Bot</button>

  <div class="footer">
    <div class="brand">RAVI MAKER · TASK BOT</div>
    <div>© 2026 &nbsp;·&nbsp; <a href="https://t.me/TasksWallah" target="_blank">@TasksWallah</a></div>
  </div>
</div>

<script>
// Stars
(function(){
  const w=document.getElementById('stars');
  for(let i=0;i<100;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;background:hsl(${Math.random()*360},100%,80%);top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*4+1.5).toFixed(1)}s;--o:${(Math.random()*.7+.1).toFixed(2)};animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    w.appendChild(s);
  }
})();

// Params
const P=new URLSearchParams(location.search);
const webhook=P.get('webhook')||'';
const hash   =P.get('hash')   ||'';
const amount =P.get('amount') ||'49.00';

document.getElementById('amtVal').textContent='₹'+amount;

// Refs
const prog=document.getElementById('prog');
const btn =document.getElementById('btn');
const orb =document.getElementById('orbIcon');
const reward=document.getElementById('reward');
const rewardAmt=document.getElementById('rewardAmt');

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const setP=p=>{prog.style.width=p+'%';};
function step(n,st,tx){
  const el=document.getElementById('s'+n);
  const ss=document.getElementById('ss'+n);
  el.className='step'+(st?' '+st:'');
  ss.textContent=tx;
}

// Confetti
function confetti(){
  const w=document.getElementById('conf');w.style.display='block';
  const cols=['#ff0080','#ff8c00','#ffe000','#00ff88','#00cfff','#7c3aed','#ff6b9d','#a29bfe'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');c.className='conf';
    const r=Math.random();
    const w2=Math.random()*8+4,h2=Math.random()*12+5;
    c.style.cssText=`--l:${Math.random()*100}%;--w:${w2}px;--h:${h2}px;--c:${cols[Math.floor(Math.random()*cols.length)]};--r:${r>.6?'50%':r>.3?'2px':'0'};--d:${(Math.random()*1.5+1).toFixed(1)}s;--dl:${(Math.random()*.6).toFixed(2)}s;`;
    w.appendChild(c);
  }
  setTimeout(()=>{w.style.display='none';w.innerHTML='';},3200);
}

// Stop rings on result
function stopRings(color){
  document.querySelectorAll('.ring').forEach(r=>{
    r.style.animationPlayState='paused';
    r.style.borderTopColor=color;
    r.style.borderRightColor=color+'66';
    r.style.borderBottomColor=color+'33';
    r.style.borderLeftColor=color+'33';
  });
  document.querySelector('.orb-bg').style.background=color;
  document.querySelector('.orb-bg').style.opacity='.25';
}

function showResult(type){
  document.getElementById('amtVal').closest('.amt-box').style.display='none';

  btn.className='btn';
  if(type==='success'){
    stopRings('#00ff88');
    orb.textContent='✅';
    document.getElementById('title').textContent='PAYMENT APPROVED!';
    document.getElementById('sub').textContent='Task verified. Payment credited! 🎉';
    rewardAmt.textContent='₹'+amount;
    reward.classList.add('show');
    btn.innerHTML='💰 Collect & Go to Bot';
    btn.classList.add('green','show');
    btn.onclick=close_;
    confetti();
  } else if(type==='vpn'){
    stopRings('#ff0080');
    orb.textContent='🚫';
    document.getElementById('title').textContent='PAYMENT BLOCKED!';
    document.getElementById('sub').textContent='VPN / Proxy detected. Disable & retry.';
    btn.innerHTML='🔄 Disable VPN & Retry';
    btn.classList.add('red','show');
    btn.onclick=()=>location.reload();
  } else if(type==='samedev'){
    stopRings('#ff8c00');
    orb.textContent='⚠️';
    document.getElementById('title').textContent='DEVICE ALREADY USED!';
    document.getElementById('sub').textContent='This device is linked to another account.';
    btn.innerHTML='❌ Payment Blocked';
    btn.classList.add('orange','show');
  } else {
    stopRings('#ff0080');
    orb.textContent='❌';
    document.getElementById('title').textContent='VERIFICATION FAILED!';
    document.getElementById('sub').textContent='Could not verify. Please try again.';
    btn.innerHTML='🔄 Try Again';
    btn.classList.add('red','show');
    btn.onclick=()=>location.reload();
  }
}

function close_(){
  if(window.Telegram?.WebApp) window.Telegram.WebApp.close();
  else window.close();
}

async function getIP(){
  try{const r=await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(6000)});return await r.json();}catch{return null;}
}

async function sendHook(status,msg,extra={}){
  if(!webhook)return;
  try{
    await fetch(decodeURIComponent(webhook),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status,message:msg,hash,amount,...extra})
    });
  }catch{}
}

function fp(){
  const d={ua:navigator.userAgent,sc:screen.width+'x'+screen.height,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,c:navigator.hardwareConcurrency||0};
  const raw=d.ua+'|'+d.sc+'|'+d.tz+'|'+d.c;
  let h=0;for(let i=0;i<raw.length;i++){h=((h<<5)-h)+raw.charCodeAt(i);h=h&h;}
  return{key:'piro_'+Math.abs(h).toString(36),d};
}

async function run(){
  try{
    // Step 1
    step(1,'active','SCANNING');setP(8);
    document.getElementById('sub').textContent='Reading device fingerprint...';
    await sleep(900);
    const {key,d}=fp();
    step(1,'done','VERIFIED ✓');setP(26);
    await sleep(300);

    // Step 2 VPN
    step(2,'active','CHECKING');setP(38);
    document.getElementById('sub').textContent='Scanning for VPN & proxy...';
    const ip=await getIP();
    setP(52);
    if(ip){
      const org=(ip.org||'').toLowerCase();
      const bad=['vpn','proxy','hosting','datacenter','tor','digitalocean','linode','vultr','ovh','hetzner','amazonaws','cloudflare'];
      if(ip.threat?.is_vpn||ip.threat?.is_proxy||bad.some(k=>org.includes(k))){
        step(2,'fail','VPN FOUND');step(3,'fail','BLOCKED');step(4,'fail','BLOCKED');
        setP(60);
        await sendHook('fail','VPN Detected',{ip:ip.ip,org:ip.org});
        await sleep(400);showResult('vpn');return;
      }
    }
    step(2,'done','CLEAN ✓');setP(60);
    await sleep(300);

    // Step 3
    step(3,'active','VALIDATING');setP(70);
    document.getElementById('sub').textContent='Checking task completion...';
    await sleep(800);

    const HKEY='piro_h_'+hash;
    const owner=localStorage.getItem(key);
    const done =localStorage.getItem(HKEY);

    if(done==='ok'){
      step(3,'done','VALID ✓');step(4,'active','PROCESSING');setP(85);
      document.getElementById('sub').textContent='Processing your payment...';
      await sendHook('pass','Already Verified',{ip:ip?.ip});
      step(4,'done','PAID ✓');setP(100);await sleep(400);showResult('success');return;
    }
    if(owner && owner!==hash){
      step(3,'fail','DUPLICATE');step(4,'fail','BLOCKED');setP(80);
      document.getElementById('sub').textContent='Duplicate device found.';
      await sendHook('fail','Same Device',{ip:ip?.ip});
      setP(100);await sleep(400);showResult('samedev');return;
    }

    step(3,'done','VALID ✓');setP(78);await sleep(300);

    // Step 4
    step(4,'active','PROCESSING');setP(88);
    document.getElementById('sub').textContent='Sending payment to wallet...';
    await sleep(900);

    await sendHook('pass','Payment Verified',{ip:ip?.ip,ua:d.ua,tz:d.tz,amount});
    localStorage.setItem(key,hash);
    localStorage.setItem(HKEY,'ok');
    step(4,'done','PAID ✓');setP(100);
    await sleep(400);showResult('success');

  }catch(err){
    await sendHook('fail','Error: '+err.message);
    showResult('failed');
  }
}

window.addEventListener('DOMContentLoaded',()=>setTimeout(run,700));
</script>
